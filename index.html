<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para o Amor da Minha Vida ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    background:linear-gradient(135deg,#ff4d6d,#ff8fab,#ffc2d1);
    font-family:'Arial',sans-serif;
    position:relative;
}

#love-message{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:100;
    color:white;
    text-shadow:0 0 20px rgba(255,255,255,.8);
}

#love-message h1{
    font-size:4rem;
    animation:pulse 2s infinite;
}

#love-message p{
    margin-top:10px;
    font-size:1.3rem;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.15);}
}

.photo{
    position:absolute;
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:20px;
    border:4px solid white;
    box-shadow:0 0 25px rgba(255,255,255,.8);
    bottom: -180px;
    animation:float linear infinite;
    animation-fill-mode: both;
}

@keyframes float{
    from{
        transform:translateY(0) rotate(0deg);
    }
    to{
        transform:translateY(calc(-100vh - 350pc)) rotate(360deg);
    }
}

.confetti{
    position:absolute;
    width:10px;
    height:10px;
    animation:fall linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-10vh) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

.sparkle{
    position:absolute;
    color:white;
    font-size:20px;
    animation:twinkle 2s infinite;
}

@keyframes twinkle{
    0%,100%{opacity:.2;}
    50%{opacity:1;}
}

@media(max-width:600px){
    #love-message h1{
        font-size:2.8rem;
    }

    .photo{
        width:90px;
        height:90px;
    }
}
</style>
</head>

<body>

<div id="love-message">
    <h1>❤️ EU TE AMO ❤️</h1>
    <p>Feliz Dia dos Namorados, meu amor!</p>
</div>

<script>

// FOTOS
const fotos = [
    "convertida.jpg", 
    "convertida2.jpg",
    "convertida3.png",
    "convertida4.png",
    "convertida5.jpg",
    "convertida6.png",
];

// Criar fotos flutuando
for(let i=0;i<30;i++){

    const foto = document.createElement("img");

    foto.src = fotos[Math.floor(Math.random()*fotos.length)];
    foto.className = "photo";

    foto.style.left = Math.random()*100 + "vw";
    foto.style.animationDuration = (12 + Math.random()*15) + "s";
    foto.style.animationDelay = "-" + (Math.random()*20) + "s";

    document.body.appendChild(foto);
}

// Confetes
const cores = [
"#ff0000",
"#00ff00",
"#0000ff",
"#ffff00",
"#ff00ff",
"#00ffff",
"#ffffff"
];

for(let i=0;i<250;i++){

    const confetti = document.createElement("div");

    confetti.className = "confetti";
    confetti.style.left = Math.random()*100 + "vw";
    confetti.style.background = cores[Math.floor(Math.random()*cores.length)];
    confetti.style.animationDuration = (4 + Math.random()*6) + "s";
    confetti.style.animationDelay = Math.random()*8 + "s";

    document.body.appendChild(confetti);
}

// Brilhos
for(let i=0;i<40;i++){

    const sparkle = document.createElement("div");

    sparkle.className = "sparkle";
    sparkle.innerHTML = "✨";

    sparkle.style.left = Math.random()*100 + "vw";
    sparkle.style.top = Math.random()*100 + "vh";
    sparkle.style.animationDelay = Math.random()*3 + "s";

    document.body.appendChild(sparkle);
}

</script>

</body>
</html>
